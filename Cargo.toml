[package]
name = "feedr"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
description = "A native resource feed for agent deliverables, with optional herdr integration"
license = "Apache-2.0"
repository = "https://github.com/SvenKratz/feedr"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit", "persistence"] }
egui_extras = { version = "0.33", features = ["file", "image"] }
egui_commonmark = "0.22"
fs2 = "0.4"
hostname = "0.4"
global-hotkey = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
open = "5"
rmcp = { version = "0.8", features = ["server", "transport-io", "macros", "schemars"] }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
libloading = "0.8"
regex = "1"
globset = "0.4"
tempfile = "3"
pulldown-cmark = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
flate2 = "1"
tar = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }
plist = "1"
toml_edit = "0.25"
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
