name: Release packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: aarch64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: brew install poppler mpv ffmpeg
      - run: python3 -m pip install dmgbuild==1.6.7 pillow==13.0.0
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked
      - run: python3 scripts/smoke.py target/release/feedr
      - run: python3 scripts/media-smoke.py target/release/feedr
        env:
          FEEDR_TEST_NULL_AUDIO: '1'
      - run: python3 scripts/package-release.py
      - name: Verify mounted installer
        run: python3 scripts/test-dmg.py dist/feedr-v*-macos-${{ matrix.arch }}.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: feedr-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/feedr-v*
  linux:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            deb: amd64
          - os: ubuntu-24.04-arm
            arch: aarch64
            deb: arm64
    runs-on: ${{ matrix.os }}
    container: rust:1.95-bookworm
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Native build, media and desktop test dependencies
        run: |
          apt-get -o Acquire::Retries=2 update
          apt-get install -y python3 build-essential pkg-config dpkg-dev desktop-file-utils xvfb xauth xdotool libxkbcommon-dev libxkbcommon-x11-0 libxcb-shape0-dev libxcb-xfixes0-dev libegl1-mesa-dev libwayland-dev libxcursor1 libxi6 libxrandr2 libxinerama1 libxrender1 poppler-utils libmpv2 ffmpeg
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked
      - run: python3 scripts/package-release.py
      - name: Test installed Debian package, media, desktop UI and removal
        run: sh scripts/test-deb.sh dist/feedr_*_${{ matrix.deb }}.deb
      - uses: actions/upload-artifact@v4
        with:
          name: feedr-linux-${{ matrix.deb }}
          if-no-files-found: error
          path: |
            dist/feedr-v*
            dist/feedr_*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-gui-${{ matrix.deb }}
          path: .artifacts/linux-gui.*
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/package-source.py
      - name: Verify source archives and lockfile
        run: |
          mkdir /tmp/feedr-source-check
          tar -xzf dist/feedr-v*-src.tar.gz -C /tmp/feedr-source-check
          cd /tmp/feedr-source-check/feedr-*
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: feedr-source
          if-no-files-found: error
          path: dist/feedr-v*-src.*
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: feedr-*
          path: dist
          merge-multiple: true
      - name: Upload as draft, verify completeness and GitHub digests, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/publish-release.py --tag "$RELEASE_TAG"
